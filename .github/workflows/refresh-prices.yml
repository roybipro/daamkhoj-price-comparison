# Refreshes the price list twice a day and commits it to main. The live server downloads it from
# there within the hour (PRICE_INDEX_URL) without a redeploy: each redeploy restarted the free
# instance and left the site starting up for a minute, which looked like it had gone to sleep.
#
# A full crawl of every page takes longer than a GitHub job may run, so each run reads at most
# `limit` pages per shop, the ones read longest ago first. 8000 a night refreshes every page
# of the biggest shop (Techland, ~40k pages) within five days, inside the 7 days after which a
# price stops being shown.
name: Refresh price list

on:
  schedule:
    - cron: '30 20 * * *' # 02:30 in Bangladesh, when the shops are quietest
    - cron: '30 10 * * *' # 16:30 in Bangladesh: a second pass, so a day's price changes show by evening
  workflow_dispatch:
    inputs:
      limit:
        description: Most pages to read per shop
        default: '8000'

permissions:
  contents: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # For the report at the end: when this crawl started, and how many current prices the list had.
      - name: Note the list before the crawl
        id: before
        run: |
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "prices=$(node tools/crawl-report.mjs --count)" >> "$GITHUB_OUTPUT"

      # One shop failing still saves the rest, so a failed exit doesn't stop the commit.
      # The job is killed at 330 minutes, and a killed job commits nothing. So the crawl starts
      # no page after 270 minutes and saves what it read, which leaves time for the commit. If it
      # still runs at 300 minutes, the step is stopped and the job commits the last progress save
      # (made every 100 pages per shop).
      - name: Crawl
        id: crawl
        continue-on-error: true
        timeout-minutes: 300
        env:
          LIMIT: ${{ inputs.limit || '8000' }}
        run: |
          case "$LIMIT" in ''|*[!0-9]*) echo "limit must be a whole number"; exit 1;; esac
          npm run crawl -- --limit="$LIMIT" --minutes=270

      - name: Check the list before saving it
        run: |
          node --input-type=module -e "
            import { loadIndexFile } from './server/price-index.mjs';
            const data = await loadIndexFile('data/price-index.json');
            const sizes = Object.entries(data.shops).map(([shop, { entries }]) => shop + ' ' + entries.length);
            const total = Object.values(data.shops).reduce((sum, { entries }) => sum + entries.length, 0);
            console.log(sizes.join('\n') + '\ntotal ' + total);
            if (total < 1000) throw new Error('the list shrank to ' + total + ' prices; not saving it');
          "

      - name: Commit the new list
        # The list on main may have changed while this crawl ran (prices published from a crawl run
        # elsewhere). A rebase would conflict on the one-line file and lose the whole crawl, so
        # instead start from main's newest list and lay over it each shop this crawl read more
        # recently than main has it (tools/merge-lists.mjs). Tried again if main moves meanwhile.
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$CRAWL" = success ]; then note=''; else note=' (some shops failed; their last prices were kept)'; fi
          cp data/price-index.json "$RUNNER_TEMP/crawled.json"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git checkout -q -f -B save origin/main
            node tools/merge-lists.mjs --into=data/price-index.json --from="$RUNNER_TEMP/crawled.json"
            git add data/price-index.json
            if git diff --cached --quiet; then
              echo 'No prices changed.'
              exit 0
            fi
            git commit -q -m "Refresh the price list$note"
            if git push origin HEAD:main; then
              echo 'pushed=yes' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo '::error::could not save the list after 3 tries'
          exit 1
        env:
          CRAWL: ${{ steps.crawl.outcome }}
        id: commit

      # A table of every shop on the run's summary page. The job fails, and GitHub emails the
      # owner, if the list lost 30% of its current prices or a third of the shops went unrefreshed.
      - name: Report
        if: always()
        env:
          STARTED: ${{ steps.before.outputs.started }}
          BEFORE: ${{ steps.before.outputs.prices }}
        run: node tools/crawl-report.mjs --since="$STARTED" --before="$BEFORE" >> "$GITHUB_STEP_SUMMARY"
